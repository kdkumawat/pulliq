# Fly.io config - free allowance: 3 shared VMs, 160GB outbound/mo
# Deploy: fly launch (first time) then fly deploy
app = "pulliq"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NODE_OPTIONS = "--max-old-space-size=1536"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# Media processing (yt-dlp + ffmpeg) is memory hungry; 1 GB OOMs under load.
# Bump to 2 GB. Concurrency is capped in code (src/lib/media/concurrency.ts)
# so even 1 GB stays usable in a pinch.
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1

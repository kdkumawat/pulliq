name: Keep alive

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 120 "https://pulliq.onrender.com/api/analyze" | head -c 200
          echo ""
          curl -fsS -o /dev/null -w "Homepage HTTP %{http_code} in %{time_total}s\n" \
            --max-time 120 "https://pulliq.onrender.com/"

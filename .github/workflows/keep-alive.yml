# BACKUP ONLY - GitHub cron is best-effort and often runs every 45-90+ minutes,
# NOT every 5 minutes. For reliable keep-alive, use UptimeRobot or cron-job.org
# (see DEPLOYMENT.md). This workflow helps when GitHub does fire on time.
name: Keep alive

on:
  schedule:
    # Every 5 min at offset minutes (avoid top-of-hour queue). Still not guaranteed.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 120 "https://pulliq.onrender.com/api/analyze" | head -c 200
          echo ""
          curl -fsS -o /dev/null -w "Homepage HTTP %{http_code} in %{time_total}s\n" \
            --max-time 120 "https://pulliq.onrender.com/"
